spring:
  application:
    name: reviora-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reviora}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:TheMaster0511}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# JWT
jwt:
  secret: ${JWT_SECRET:reviora-super-secret-key-min-256-bits-long-change-in-prod}
  expiration: 86400000       # 24h in ms
  refresh-expiration: 604800000  # 7 days

# Piston API
piston:
  api-url: ${PISTON_API_URL:http://localhost:2000/api/v2}
  timeout: 15000

# OpenRouter AI
openrouter:
  api-key: ${OPENROUTER_API_KEY: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}
  api-url: https://openrouter.ai/api/v1
  model: anthropic/claude-3.5-haiku

# Google OAuth
google:
  client-id: ${GOOGLE_CLIENT_ID:508565663421-rbdhempcjr7u72irg918hksppu10kbrr.apps.googleusercontent.com}

# Rate Limiting
rate-limit:
  submissions-per-minute: 10
  ai-requests-per-hour: 20

# Logging
logging:
  level:
    com.reviora: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600
